name: Build SpeedCool App
on:
  workflow_dispatch:
  push:
    branches: [ "app-v2.4" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - run: |
        mkdir -p $HOME/android-sdk
        curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline.zip
        unzip -q cmdline.zip -d $HOME/android-sdk
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/bin:$PATH
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
        chmod +x gradlew
        ANDROID_HOME=$HOME/android-sdk ./gradlew assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: SpeedCoolApp
        path: app/build/outputs/apk/debug/app-debug.apk
